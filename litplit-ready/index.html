<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LitPlit — Визуализатор декоративных люков</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <style>
        /* Аварийные стили для гарантированного отображения интерфейса */
        body {
            background-color: #121212 !important;
            color: #ffffff !important;
            font-family: 'Inter', sans-serif !important;
            margin: 0;
            padding: 0;
        }
        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 30px;
        }
        h1 {
            color: #e5a93b;
            margin: 0 0 10px 0;
        }
        .visualizer-grid {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
        }
        @media (max-width: 900px) {
            .visualizer-grid { grid-template-columns: 1fr; }
        }
        .main-view-panel {
            background: #1a1a1a;
            border: 2px dashed #3a3a3a;
            border-radius: 12px;
            min-height: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .preview-image {
            max-width: 100%;
            max-height: 600px;
            object-fit: contain;
        }
        .control-sidebar {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .btn-primary {
            background: #e5a93b;
            color: #000000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: #ffc457; }
        .upload-zone {
            text-align: center;
            cursor: pointer;
            padding: 40px 20px;
        }
        .upload-icon {
            font-size: 48px;
            color: #e5a93b;
            margin-bottom: 15px;
        }
        .catalog-section h3 {
            color: #e5a93b;
            margin-top: 0;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 10px;
        }
        .hatch-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        .hatch-item {
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            padding: 8px;
            cursor: pointer;
            text-align: center;
            background: #222222;
            transition: border-color 0.2s;
        }
        .hatch-item:hover, .hatch-item.active {
            border-color: #e5a93b;
            background: #2a241b;
        }
        .hatch-item img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 5px;
        }
        .hatch-item span {
            font-size: 12px;
            display: block;
            color: #ccc;
        }
        #fileInput { display: none; }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>LitPlit</h1>
            <p>Интеллектуальный конфигуратор художественных чугунных люков</p>
        </header>

        <div class="visualizer-grid">
            <div class="main-view-panel" id="dropZone">
                <input type="file" id="fileInput" accept="image/*">
                <div class="upload-zone" id="uploadPrompt">
                    <div class="upload-icon">↑</div>
                    <h3>Загрузите фото вашего объекта</h3>
                    <p>Перетащите изображение сюда или кликните для выбора</p>
                </div>
                <img id="mainVisualizerView" class="preview-image" style="display: none;" alt="Визуализация">
            </div>

            <div class="control-sidebar">
                <div class="catalog-section">
                    <h3>Каталог люков</h3>
                    <div class="hatch-grid" id="catalogGrid">
                        </div>
                </div>

                <div class="actions-section">
                    <button class="btn-primary" id="generateButton">Сгенерировать с ИИ →</button>
                </div>
                <div id="statusNotification" style="color: #e5a93b; text-align: center; font-size: 14px; font-weight: 500;"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Инициализация каталога люков прямо внутри страницы
        const hatches = [
            { id: 'hatch1', name: 'Арт-Нуво Рисунок', url: 'covers/art-nouveau.png' },
            { id: 'hatch2', name: 'Классический узор', url: 'covers/classic.png' },
            { id: 'hatch3', name: 'Лофт Сетка', url: 'covers/loft.png' },
            { id: 'hatch4', name: 'Современный минимализм', url: 'covers/modern.png' }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const grid = document.getElementById("catalogGrid");
            const dropZone = document.getElementById("dropZone");
            const fileInput = document.getElementById("fileInput");
            const uploadPrompt = document.getElementById("uploadPrompt");
            const mainImg = document.getElementById("mainVisualizerView");

            // Рендер каталога
            hatches.forEach(h => {
                const item = document.createElement("div");
                item.className = "hatch-item";
                item.innerHTML = `<img src="${h.url}" onerror="this.src='https://placehold.co/80x80?text=Люк'" alt="${h.name}"><span>${h.name}</span>`;
                item.onclick = () => {
                    document.querySelectorAll(".hatch-item").forEach(i => i.classList.remove("active"));
                    item.classList.add("active");
                    selectedHatchUrl = h.url;
                };
                grid.appendChild(item);
            });

            // Обработка загрузки фото
            dropZone.onclick = (e) => { if(e.target !== fileInput) fileInput.click(); };
            fileInput.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        currentBackgroundBase64 = event.target.result;
                        mainImg.src = currentBackgroundBase64;
                        mainImg.style.display = "block";
                        uploadPrompt.style.display = "none";
                    };
                    reader.readAsDataURL(file);
                }
            };
        });
    </script>
</body>
</html>
